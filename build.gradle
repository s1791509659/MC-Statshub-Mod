// Stats Web — multi-platform build
//
//   core   — platform-independent engine (stats / advancements / playerdata scanning,
//            embedded HTTP server, web assets). Uses no game classes.
//   fabric — Fabric shell; produces the single self-contained mod jar.
//   paper  — Paper / Spigot shell; produces the plugin jar from the same core.
//
// Neither shell uses a loader-specific toolchain: the core compiles against zero Minecraft
// classes, so plain compile-only API dependencies suffice and the artifacts load on any
// game version with a compatible loader / Bukkit api-version.

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    java {
        // Bytecode target: Java 17, the lowest runtime shared by every supported
        // Minecraft version and mod loader. No toolchain is requested — the Gradle
        // JVM compiles with --release 17, which keeps the worker stable on this machine.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
