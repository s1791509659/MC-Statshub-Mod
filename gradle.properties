org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod
mod_version=2.0.0
maven_group=dev.statsweb
archives_base_name=statsweb

# Compile-only APIs — all three are provided by the game at runtime, never packed:
# Minecraft ships gson + slf4j, Paper/Spigot ship slf4j and expose gson through the API.
fabric_loader_version=0.19.5
gson_version=2.11.0
slf4j_version=2.0.9

# Documentation only: no Minecraft classes are compiled against any more, so the jar
# is not tied to a single game version. 26.2 is the version this build was verified on.
minecraft_version=26.2

# Printed into the artifact filename so a server admin can tell at a glance what it fits:
#   statsweb-<version>-fabric-mc1.18.2-26.x-loader0.14.jar
# 1.18.2 = oldest world layout we can read, 26.x = newest branch (26.2 is what we test on).
artifact_mc_range=1.18.2-26.x
artifact_loader_min=0.14
